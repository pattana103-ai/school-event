<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="ระบบแจ้งปฏิทินการปฏิบัติงาน โรงเรียนพัฒนศึกษา">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ปฏิทินงาน">
  <title>ระบบแจ้งปฏิทินการปฏิบัติงาน</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #eff6ff;
      color: #172554;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; }

    main { position: relative; height: 100vh; height: 100dvh; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: white; }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 24px;
      background: #eff6ff;
      color: #334155;
      text-align: center;
      pointer-events: none;
    }

    .loading.hidden { display: none; }
    .loading a { color: #1d4ed8; pointer-events: auto; }

    .direct {
      position: fixed;
      left: 8px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      width: 32px;
      height: 32px;
      display: grid;
      place-content: center;
      border-radius: 50%;
      background: rgba(23, 37, 84, .55);
      color: #fff;
      font-size: 16px;
      text-decoration: none;
      z-index: 10;
    }

  </style>
</head>
<body>
  <main>
    <div id="loading" class="loading" role="status">
      <strong>กำลังเปิดระบบ...</strong>
      <span>หากหน้าจอไม่แสดง <a href="https://script.google.com/macros/s/AKfycbyERKSLPiL8MwSwbej7orKGLCQm1LlVV4sBPNtP7vajljbYxyRUvnuQbwbT4t8gl8utVQ/exec" target="_blank" rel="noopener">เปิดระบบในแท็บใหม่</a></span>
    </div>
    <iframe
      id="appFrame"
      title="ระบบแจ้งปฏิทินการปฏิบัติงาน"
      src="https://script.google.com/macros/s/AKfycbyERKSLPiL8MwSwbej7orKGLCQm1LlVV4sBPNtP7vajljbYxyRUvnuQbwbT4t8gl8utVQ/exec"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <a class="direct" href="./?direct=1" title="เปิดระบบแบบเต็มหน้าจอ" aria-label="เปิดระบบแบบเต็มหน้าจอ">&#x2197;</a>
  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbyERKSLPiL8MwSwbej7orKGLCQm1LlVV4sBPNtP7vajljbYxyRUvnuQbwbT4t8gl8utVQ/exec';

    // ใส่ ?direct=1 เพื่อเปิด Apps Script โดยตรง (ใช้เมื่อเบราว์เซอร์บางตัวไม่แสดงแบบฝัง)
    if (new URLSearchParams(location.search).has('direct')) {
      location.replace(APP_URL);
    }

    document.getElementById('appFrame').addEventListener('load', () => {
      document.getElementById('loading').classList.add('hidden');
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(error => {
          console.error('ลงทะเบียน service worker ไม่สำเร็จ', error);
        });
      });
    }
  </script>
</body>
</html>
